[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slo-budget-sim"
version = "0.1.0"
description = "Trace-replay simulator for SLO-budget span sampling (Stage 1)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slo-budget-sim = "slo_budget_sim.cli:main"

[tool.setuptools.packages.find]
include = ["slo_budget_sim*"]

[tool.setuptools.package-data]
slo_budget_sim = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
